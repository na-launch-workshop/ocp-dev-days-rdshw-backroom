apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: enable-ai-sandbox
  title: Enable AI Sandbox
  description: Deploy OpenShift sandboxed containers Operator and Claude Gateway
  tags:
    - backroom
    - ai
spec:
  type: backroom
  owner: group:default/admins
  parameters:
    - title: Enable AI Sandbox
      description: >-
        This will deploy the OpenShift sandboxed containers Operator (Kata)
        and Claude Gateway to the cluster. Note: KataConfig takes
        several minutes to configure worker nodes.
  steps:
    - id: render-override
      name: Render override file
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: .
    - id: push-to-repo
      name: Push override file to backroom repo
      action: gitlab:repo:push
      input:
        repoUrl: "{{ gitlab_host }}?owner=workshop&repo=backroom"
        branchName: main
        commitMessage: "Enable AI sandbox backroom add-on"
  output:
    links:
      - title: Open ArgoCD
        url: https://openshift-gitops-server-openshift-gitops.{{ cluster_subdomain }}/applications/openshift-gitops/backroom
