apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: enable-ai-sandbox
  title: Enable AI Sandbox
  description: Deploy OpenShift sandboxed containers Operator and Claude Gateway
  tags:
    - backroom
    - ai
spec:
  type: backroom
  owner: group:default/admins
  parameters:
    - title: Enable AI Sandbox
      description: >-
        This will deploy the OpenShift sandboxed containers Operator (Kata)
        and Claude Gateway to the cluster. Note: KataConfig takes
        several minutes to configure worker nodes.
  steps:
    - id: render-override
      name: Render override file
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: .
    - id: create-merge-request
      name: Create merge request to enable AI sandbox
      action: publish:gitlab:merge-request
      input:
        repoUrl: "{{ gitlab_host }}?owner=workshop&repo=backroom"
        branchName: enable-ai-sandbox
        title: "Enable AI Sandbox"
        description: "Enable Sandboxed Containers and Claude Gateway deployment via backroom add-on"
        removeSourceBranch: true
  output:
    links:
      - title: Merge This Merge Request
        url: ${{ steps['create-merge-request'].output.mergeRequestUrl }}
      - title: Open ArgoCD
        url: https://openshift-gitops-server-openshift-gitops.{{ cluster_subdomain }}/applications/openshift-gitops/backroom
