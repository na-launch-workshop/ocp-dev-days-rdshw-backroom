apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: enable-keda
  title: Enable Custom Metrics Autoscaler
  description: This will deploy the Custom Metrics Autoscaler operator and the KEDA HTTP add-on to the cluster.
  tags:
    - backroom
    - keda
spec:
  type: backroom
  owner: group:default/admins
  parameters:
    - title: Enable Custom Metrics Autoscaler
      description: >-
        This will deploy the Custom Metrics Autoscaler operator to the
        cluster, along with the KEDA HTTP add-on for scaling HTTP
        workloads to and from zero.
  steps:
    - id: render-override
      name: Render override file
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: .
    - id: create-merge-request
      name: Create merge request to enable Custom Metrics Autoscaler
      action: publish:gitlab:merge-request
      input:
        repoUrl: "{{ gitlab_host }}?owner=workshop&repo=backroom"
        branchName: enable-keda
        title: "Enable Custom Metrics Autoscaler"
        description: "Enable Custom Metrics Autoscaler deployment via backroom add-on"
        removeSourceBranch: true
  output:
    links:
      - title: Merge This Merge Request
        url: ${{ steps['create-merge-request'].output.mergeRequestUrl }}
      - title: Open ArgoCD
        url: https://openshift-gitops-server-openshift-gitops.{{ cluster_subdomain }}/applications/openshift-gitops/backroom
