apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: enable-observability
  title: Enable Observability
  description: Deploy OpenTelemetry and Tempo Operators
  tags:
    - backroom
    - observability
spec:
  type: backroom
  owner: group:default/admins
  parameters:
    - title: Enable Observability Stack
      description: >-
        This will deploy the Tempo distributed tracing backend and the
        OpenTelemetry collector to the cluster.
  steps:
    - id: render-override
      name: Render override file
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: .
    - id: push-to-repo
      name: Push override file to backroom repo
      action: gitlab:repo:push
      input:
        repoUrl: "{{ gitlab_host }}?owner=workshop&repo=backroom"
        branchName: main
        commitMessage: "Enable observability backroom add-on"
  output:
    links:
      - title: Open ArgoCD
        url: https://openshift-gitops-server-openshift-gitops.{{ cluster_subdomain }}/applications/openshift-gitops/backroom
