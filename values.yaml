gitops:
  repoURL: https://github.com/na-launch-workshop/ocp-dev-days-rdshw-gitops.git
  targetRevision: main

argocd:
  namespace: openshift-gitops

cluster:
  subdomain: ""

catalogSource:
  source: redhat-operators-snapshot

observability:
  enabled: false
  tempo:
    name: tempo
    namespace: tempo
  opentelemetry:
    name: opentelemetry
    namespace: opentelemetry

aiSandbox:
  enabled: false
  sandboxedContainers:
    name: sandboxed-containers
    namespace: openshift-sandboxed-containers-operator
  claudeGateway:
    name: claude-gateway
    namespace: claude-sandbox

keda:
  enabled: false
  name: keda
  namespace: openshift-keda
  # KEDA HTTP add-on (https://github.com/kedacore/http-add-on). The Custom Metrics
  # Autoscaler operator declares the http.keda.sh CRDs but does not deploy the
  # interceptor, so the upstream chart is installed alongside it.
  httpAddon:
    enabled: true
    name: keda-http-add-on
    namespace: keda
    repoURL: https://kedacore.github.io/charts
    chart: keda-add-ons-http
    version: 0.16.0
